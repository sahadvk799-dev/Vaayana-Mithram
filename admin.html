<!doctype html><html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | വായനാമിത്രം</title>
<style>body{font-family:system-ui,sans-serif;background:#f3f8f5;color:#18372d;margin:0}header{background:#164e3b;color:white;padding:20px;text-align:center}main{max-width:800px;margin:20px auto;padding:0 14px}.panel{background:white;padding:18px;border-radius:14px;margin:14px 0}input,textarea,button{font:inherit;padding:10px;margin:5px 0;max-width:100%}input,textarea{width:96%;box-sizing:border-box}textarea{min-height:120px}button{cursor:pointer;background:#176b50;color:white;border:0;border-radius:8px}.hidden{display:none}.row{border-top:1px solid #ddd;padding:10px 0}</style></head><body><header><h1>വായനാമിത്രം — Admin</h1><a style="color:white" href="index.html">കുട്ടികളുടെ പേജ്</a></header><main>
<section id="login" class="panel"><h2>Admin ലോഗിൻ</h2><input id="email" type="email" placeholder="Admin ഇമെയിൽ"><input id="password" type="password" placeholder="പാസ്‌വേഡ്"><button id="loginBtn">ലോഗിൻ</button></section>
<section id="editor" class="panel hidden"><h2>കാർഡ് ചേർക്കുക / മാറ്റുക</h2><input id="id" placeholder="കാർഡ് ID (പുതിയതെങ്കിൽ ഒഴിച്ചിടുക)"><input id="title" placeholder="കാർഡിന്റെ തലക്കെട്ട്"><textarea id="body" placeholder="വായനാ വാചകം"></textarea><input id="position" type="number" placeholder="ക്രമം" value="1"><button id="save">സേവ് / പ്രസിദ്ധീകരിക്കുക</button><button id="clear">പുതിയ കാർഡ്</button><h2>നിലവിലുള്ള കാർഡുകൾ</h2><div id="list"></div><p id="msg"></p><button id="logout">ലോഗ് ഔട്ട്</button></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
const loginPanel=document.getElementById('login'), editor=document.getElementById('editor'), msg=document.getElementById('msg');
async function show(){try{const role=await currentRole();if(role==='admin'){loginPanel.classList.add('hidden');editor.classList.remove('hidden');await listCards()}}catch(e){msg.textContent=e.message}}
async function listCards(){try{const cards=await loadCards();const list=document.getElementById('list');list.innerHTML='';cards.forEach(c=>{const d=document.createElement('div');d.className='row';d.innerHTML='<b>'+escapeHtml(c.title)+'</b> — '+escapeHtml(c.body)+' <button>മാറ്റുക</button> <button>നീക്കുക</button>';const bs=d.querySelectorAll('button');bs[0].onclick=()=>{document.getElementById('id').value=c.id;document.getElementById('title').value=c.title;document.getElementById('body').value=c.body;document.getElementById('position').value=c.position};bs[1].onclick=async()=>{if(confirm('ഈ കാർഡ് നീക്കണോ?')){const r=await deleteCard(c.id);if(r.error)msg.textContent=r.error.message;await listCards()}};list.appendChild(d)})}catch(e){msg.textContent=e.message}}
document.getElementById('loginBtn').onclick=async()=>{const r=await signIn(document.getElementById('email').value,document.getElementById('password').value);if(r.error){alert(r.error.message);return}await show();if(editor.classList.contains('hidden'))alert('ഈ അക്കൗണ്ടിന് Admin role നൽകിയിട്ടില്ല.')}
document.getElementById('save').onclick=async()=>{const card={id:document.getElementById('id').value.trim()||crypto.randomUUID(),title:document.getElementById('title').value.trim(),body:document.getElementById('body').value.trim(),position:Number(document.getElementById('position').value)||1};if(!card.title||!card.body){msg.textContent='തലക്കെട്ടും വാചകവും നൽകുക.';return}const r=await saveCard(card);msg.textContent=r.error?'സേവ് പരാജയപ്പെട്ടു: '+r.error.message:'കാർഡ് പ്രസിദ്ധീകരിച്ചു.';if(!r.error){document.getElementById('id').value='';document.getElementById('title').value='';document.getElementById('body').value='';await listCards()}}
document.getElementById('clear').onclick=()=>{document.getElementById('id').value='';document.getElementById('title').value='';document.getElementById('body').value='';document.getElementById('position').value=1}
document.getElementById('logout').onclick=async()=>{await signOut();location.reload()};show();
</script></body></html>
