<!doctype html><html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>വായനാമിത്രം Admin</title><style>body{font-family:system-ui;background:#f3f8f5;color:#18372d;margin:0}header{background:#164e3b;color:white;padding:20px;text-align:center}main{max-width:800px;margin:20px auto;padding:14px}.panel{background:white;padding:18px;border-radius:14px}input,textarea,button{font:inherit;padding:10px;margin:5px 0;max-width:100%}input,textarea{width:96%;box-sizing:border-box}textarea{min-height:100px}button{background:#176b50;color:white;border:0;border-radius:8px;padding:12px}#status{white-space:pre-wrap;background:#fff7d6;padding:12px;border-radius:8px}.hidden{display:none}</style></head><body><header><h1>വായനാമിത്രം — Admin</h1><a style="color:white" href="index.html">കുട്ടികളുടെ പേജ്</a></header><main><section id="login" class="panel"><h2>Admin ലോഗിൻ</h2><input id="email" type="email" autocomplete="username" value="sahadvk799@gmail.com"><input id="password" type="password" autocomplete="current-password" placeholder="പാസ്‌വേഡ്"><button id="loginBtn">ലോഗിൻ</button><p id="status">പേജ് തയ്യാറാണ്.</p></section><section id="editor" class="panel hidden"><h2>കാർഡ് ചേർക്കുക / മാറ്റുക</h2><input id="id" placeholder="കാർഡ് ID (പുതിയതെങ്കിൽ ഒഴിച്ചിടുക)"><input id="title" placeholder="തലക്കെട്ട്"><textarea id="body" placeholder="വായനാ വാചകം"></textarea><input id="position" type="number" value="1"><button id="save">സേവ് / പ്രസിദ്ധീകരിക്കുക</button><button id="logout">ലോഗ് ഔട്ട്</button><p id="editstatus"></p><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
const s=document.getElementById('status'), login=document.getElementById('login'), editor=document.getElementById('editor');
document.getElementById('loginBtn').onclick=async()=>{const b=document.getElementById('loginBtn');b.disabled=true;s.textContent='ലോഗിൻ ശ്രമിക്കുന്നു…';try{if(!window.supabase)throw Error('Supabase library ലോഡ് ആയില്ല');const r=await signIn(document.getElementById('email').value.trim(),document.getElementById('password').value);if(r.error)throw r.error;s.textContent='ലോഗിൻ വിജയിച്ചു. Role പരിശോധിക്കുന്നു…';const role=await currentRole();if(role!=='admin')throw Error('Admin role ലഭിച്ചില്ല. ലഭിച്ച role: '+String(role));login.classList.add('hidden');editor.classList.remove('hidden');s.textContent='Admin login വിജയിച്ചു.';await listCards()}catch(e){s.textContent='പിശക്: '+(e.message||String(e))}finally{b.disabled=false}};
async function listCards(){const list=document.getElementById('list');try{const cards=await loadCards();list.innerHTML='';if(!cards.length){list.textContent='ഇപ്പോൾ കാർഡുകളില്ല.';return}cards.forEach(c=>{const d=document.createElement('p');d.textContent=c.title+' — '+c.body;list.appendChild(d)})}catch(e){list.textContent='കാർഡുകൾ ലോഡ് ചെയ്യാനായില്ല: '+e.message}}
document.getElementById('save').onclick=async()=>{const x={id:document.getElementById('id').value.trim()||crypto.randomUUID(),title:document.getElementById('title').value.trim(),body:document.getElementById('body').value.trim(),position:Number(document.getElementById('position').value)||1};const m=document.getElementById('editstatus');try{const r=await saveCard(x);if(r.error)throw r.error;m.textContent='കാർഡ് സേവ് ചെയ്തു.';await listCards()}catch(e){m.textContent='സേവ് പിശക്: '+e.message}};
document.getElementById('logout').onclick=async()=>{await signOut();location.reload()};
</script></body></html>
